    <script>
  // High-performance scroll & iframe pointer-events smoother + Chatbot Scroll Safeguard
  (function() {
    var isScrollingTimer = null;
    var iframes = null;

    function getIframes() {
      if (!iframes || iframes.length === 0) {
        iframes = document.querySelectorAll('iframe:not([data-interactive="true"])');
      }
      return iframes;
    }

    function onScrollStart() {
      var frames = getIframes();
      for (var i = 0; i < frames.length; i++) {
        frames[i].style.pointerEvents = 'none';
      }
      clearTimeout(isScrollingTimer);
      isScrollingTimer = setTimeout(function() {
        var frames = getIframes();
        for (var i = 0; i < frames.length; i++) {
          frames[i].style.pointerEvents = 'auto';
        }
      }, 100);
    }

    window.addEventListener('wheel', onScrollStart, { passive: true });
    window.addEventListener('scroll', onScrollStart, { passive: true });
    window.addEventListener('touchmove', onScrollStart, { passive: true });

    // Chatbot click scroll-preserver: Never allow clicking chatbot to jump/reset scroll to top!
    document.addEventListener('click', function(e) {
      var inChat = e.target && e.target.closest && (
        e.target.closest('#webbi-root') || 
        e.target.closest('.wc-floating-button') || 
        e.target.closest('.wc-chat-panel') ||
        e.target.closest('button[aria-label*="chat"]')
      );
      if (inChat) {
        var currentScroll = window.__lenis ? window.__lenis.scroll : window.scrollY;
        var restoreScroll = function() {
          if (window.__lenis && Math.abs(window.__lenis.scroll - currentScroll) > 10) {
            window.__lenis.scrollTo(currentScroll, { immediate: true });
          } else if (Math.abs(window.scrollY - currentScroll) > 10) {
            window.scrollTo(0, currentScroll);
          }
        };
        for (var t = 10; t <= 500; t += 30) {
          setTimeout(restoreScroll, t);
        }
      }
    }, true);
  })();
</script>
