<script id="project-click-interceptor">
  (function() {
    let startX = 0, startY = 0;
    document.addEventListener('pointerdown', function(e) {
      startX = e.clientX;
      startY = e.clientY;
    }, true);

    document.addEventListener('click', function(e) {
      let a = e.target.closest('a');
      if (a && a.href && a.href.includes('framer.com')) return;
      if (e.target.closest('.carousel-nav-container') || e.target.closest('.pc-dot')) return;

      let dx = Math.abs(e.clientX - startX);
      let dy = Math.abs(e.clientY - startY);
      if (dx > 15 || dy > 15) return;

      let clickedSlideStr = "";
      if (a && a.getAttribute('aria-label')) {
         let label = a.getAttribute('aria-label');
         if (label.toLowerCase().includes('slide')) {
             clickedSlideStr = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
         } else {
             clickedSlideStr = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
         }
      }

      if (!clickedSlideStr) {
        let img = e.target.closest('img');
        if (img && img.src && img.src.includes('slide-')) {
           let m = img.src.match(/slide-(\d+)/);
           if (m) clickedSlideStr = "slide-" + m[1];
        }
      }

      if (!clickedSlideStr) {
        let activeDot = document.querySelector('.pc-dot[aria-current="true"]') || document.querySelector('.pc-dot[style*="16px"]');
        let activeIndex = 1;
        if (activeDot) {
          let aria = activeDot.getAttribute('aria-label') || '';
          let m = aria.match(/\d+/);
          if (m) activeIndex = parseInt(m[0], 10);
        }
        let clickX = e.clientX || window.innerWidth / 2;
        if (clickX < window.innerWidth * 0.32) {
          activeIndex = ((activeIndex - 2 + 9) % 9) + 1;
        } else if (clickX > window.innerWidth * 0.68) {
          activeIndex = (activeIndex % 9) + 1;
        }
        clickedSlideStr = "slide-" + activeIndex;
      }

      if (clickedSlideStr) {
         e.preventDefault();
         e.stopPropagation();

         let cardW = Math.min(320, window.innerWidth * 0.85);
         let cardH = cardW * 0.625;

         let rect = null;
         let imageUrl = '';
         try {
           if (e.target) {
             let targetEl = e.target.closest('a, img');
             if (targetEl) {
               const bcr = targetEl.getBoundingClientRect();
               if (bcr.width > 50 && bcr.width < window.innerWidth * 0.9 && bcr.height > 50 && bcr.height < window.innerHeight * 0.9) {
                 rect = { top: bcr.top, left: bcr.left, width: bcr.width, height: bcr.height };
               }
             }

             let el = e.target;
             while(el && el !== document.body) {
                let style = window.getComputedStyle(el);
                if (style.backgroundImage && style.backgroundImage !== 'none') {
                   imageUrl = style.backgroundImage.replace(/^url\(['"]?([^'"]+)['"]?\)/, '$1');
                   break;
                }
                if (el.tagName === 'IMG') {
                   imageUrl = el.src;
                   break;
                }
                el = el.parentElement;
             }
           }
         } catch(err) {}

         if (!rect) {
           let clickX = e.clientX || window.innerWidth / 2;
           let clickY = e.clientY || window.innerHeight / 2;
           let left = Math.max(16, Math.min(window.innerWidth - cardW - 16, clickX - cardW / 2));
           let top = Math.max(16, Math.min(window.innerHeight - cardH - 16, clickY - cardH / 2));
           rect = { top: top, left: left, width: cardW, height: cardH };
         }

         if (!imageUrl || imageUrl.includes('none') || imageUrl.length < 5) {
           let m = clickedSlideStr.match(/slide-(\d+)/i);
           let sNum = m ? m[1] : '1';
           imageUrl = `/assets/all-works-mobile-carousel/slide-${sNum}.jpg`;
         }

         window.parent.postMessage({ type: 'PROJECT_CLICK', slug: clickedSlideStr, label: 'Project', rect, imageUrl }, '*');
      }
    }, true);
  })();
</script>

<script id="mobile-carousel-controller">
  (function() {
    function getCarousel() {
      return window.allWorksCarousel || window.carouselController || null;
    }

    document.addEventListener('click', function(e) {
      const carousel = getCarousel();

      const prevBtn = e.target.closest('.carousel-prev-btn');
      if (prevBtn) {
        e.preventDefault();
        e.stopPropagation();
        if (carousel && typeof carousel.goToIndex === 'function') {
          carousel.goToIndex(carousel.currentIndex - 1);
        }
        return;
      }

      const nextBtn = e.target.closest('.carousel-next-btn');
      if (nextBtn) {
        e.preventDefault();
        e.stopPropagation();
        if (carousel && typeof carousel.goToIndex === 'function') {
          carousel.goToIndex(carousel.currentIndex + 1);
        }
        return;
      }

      const dot = e.target.closest('.pc-dot');
      if (dot) {
        e.preventDefault();
        e.stopPropagation();
        const idxAttr = dot.getAttribute('data-index');
        let idx = idxAttr !== null ? parseInt(idxAttr, 10) : -1;
        if (isNaN(idx) || idx < 0) {
          const dots = Array.from(document.querySelectorAll('.pc-dot'));
          idx = dots.indexOf(dot);
        }
        if (idx >= 0 && carousel && typeof carousel.goToIndex === 'function') {
          carousel.goToIndex(idx);
        }
        return;
      }
    }, true);
  })();
</script>
