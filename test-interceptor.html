<script id="project-click-interceptor">
  (function() {
    let startX = 0, startY = 0;
    document.addEventListener('pointerdown', function(e) {
      startX = e.clientX;
      startY = e.clientY;
    }, true);

    document.addEventListener('click', function(e) {
      // If it's the framer badge, let it go
      let a = e.target.closest('a');
      if (a && a.href && a.href.includes('framer.com')) return;
      
      // If it's pagination dots, let it go
      if (e.target.closest('[aria-label^="Show card"]') || e.target.closest('[aria-label="Carousel pagination"]')) return;

      let dx = Math.abs(e.clientX - startX);
      let dy = Math.abs(e.clientY - startY);
      
      // If dragged more than 5px, it's a swipe, not a click
      if (dx > 10 || dy > 10) return;

      let clickedSlideStr = "";
      
      // Try to find the slide number from an image src
      let img = e.target.closest('img');
      if (img && img.src && img.src.includes('slide-')) {
         let m = img.src.match(/slide-(\d+)/);
         if (m) clickedSlideStr = "slide-" + m[1];
      }
      
      // Try background image
      if (!clickedSlideStr) {
         let style = window.getComputedStyle(e.target);
         if (style.backgroundImage && style.backgroundImage.includes('slide-')) {
            let m = style.backgroundImage.match(/slide-(\d+)/);
            if (m) clickedSlideStr = "slide-" + m[1];
         }
      }

      // If we clicked inside the carousel container, let's trigger a project click.
      // Assuming anything other than the background is a slide.
      let slug = clickedSlideStr || 'work-landing';
      
      e.preventDefault();
      e.stopPropagation();
      window.parent.postMessage({ type: 'PROJECT_CLICK', slug: slug, label: 'Project' }, '*');
    }, true);
  })();
</script>
